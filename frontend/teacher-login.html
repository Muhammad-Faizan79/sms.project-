<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Login - SRMS</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/teacher-login.css">
</head>
<body class="auth">
  <div class="auth-card">
    <div class="auth-side">
      <div class="logo">👨‍🏫</div>
      <h1>Teacher Portal</h1>
      <p>Enter marks, take attendance and post notices for your students.</p>
    </div>

    <div class="auth-form">
      <button class="theme-btn auth-theme" id="themeBtn" type="button">🌙 Dark</button>
      <h2>Teacher Login</h2>
      <p class="sub">Sign in with your Teacher ID or email.</p>

      <form id="loginForm">
        <div class="fld">
          <label for="userId">Teacher ID / Email</label>
          <input id="userId" type="text" placeholder="e.g. T001">
        </div>
        <div class="fld">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter password">
        </div>
        <p class="msg err" id="loginError"></p>
        <button class="btn primary" style="width:100%;height:44px" type="submit">Login as Teacher</button>
      </form>

      <div class="demo">Teacher accounts are created by the administrator.</div>

      <div class="links">
        <a href="student-login.html">Student Login</a>
        <a href="admin-login.html">Admin Login</a>
        <a href="index.html">Home</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/teacher-login.js"></script>
</body>
</html>
