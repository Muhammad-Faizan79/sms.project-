<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login - SRMS</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/admin-login.css">
</head>
<body class="auth">
  <div class="auth-card">
    <div class="auth-side">
      <div class="logo">🛡️</div>
      <h1>Admin Console</h1>
      <p>Manage students, teachers, courses, results and notices.</p>
    </div>

    <div class="auth-form">
      <button class="theme-btn auth-theme" id="themeBtn" type="button">🌙 Dark</button>
      <h2>Admin Login</h2>
      <p class="sub">Authorized personnel only.</p>

      <form id="loginForm">
        <div class="fld">
          <label for="userId">Admin Email</label>
          <input id="userId" type="email" placeholder="admin@example.com" required>
        </div>
        <div class="fld">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter password">
        </div>
        <p class="msg err" id="loginError"></p>
        <button class="btn primary" style="width:100%;height:44px" type="submit">Login as Admin</button>
      </form>

      <details class="demo">
        <summary>First-time admin setup</summary>
        <form id="setupForm">
          <div class="fld"><label for="setupName">Admin Name</label><input id="setupName" type="text" required></div>
          <div class="fld"><label for="setupEmail">Admin Email</label><input id="setupEmail" type="email" required></div>
          <div class="fld"><label for="setupPassword">Password (8+ characters)</label><input id="setupPassword" type="password" minlength="8" required></div>
          <button class="btn primary" style="width:100%;margin-top:8px" type="submit">Create Admin Account</button>
        </form>
      </details>

      <div class="links">
        <a href="student-login.html">Student Login</a>
        <a href="teacher-login.html">Teacher Login</a>
        <a href="index.html">Home</a>
      </div>
    </div>
  </div>

  <script  type="module" src="js/admin-login.js"></script>
</body>
</html>
